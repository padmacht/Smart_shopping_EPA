# ShopSmart AI - CI/CD pipeline (GitHub Actions)
#
# On every push and pull request:
#   1. test     - install, validate the data, run pytest, check model quality,
#                 compare keyword vs sentence-embedding search (results on the run's summary page)
#   2. docker   - build the Docker image and smoke-test the API inside it
# Render deploys only after these checks pass (Render: Settings > Auto-Deploy > "After CI Checks Pass").
#
# Every Monday (and on demand from the Actions tab):
#   3. retrain  - check data drift with Evidently, retrain segmentation + recommenders from the raw
#                 data, log runs to MLflow, re-check quality, and keep the drift report, MLflow runs
#                 and reports as a downloadable artifact.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and quality gate
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate data
        run: python -m shopsmart.data.validate

      - name: Run tests
        run: python -m pytest -q

      - name: Model quality gate
        run: python scripts/check_model_quality.py

      - name: Evaluate search (keyword vs sentence embeddings)
        run: python -m shopsmart.search_eval

  docker:
    name: Build and smoke-test Docker image
    if: github.event_name != 'schedule'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t shopsmart:${{ github.sha }} .

      - name: Start the API and check it answers
        run: |
          docker run -d --name api -p 8000:8000 shopsmart:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/health; then break; fi
            sleep 2
          done
          curl -fs http://localhost:8000/health
          curl -fs "http://localhost:8000/recommendations/1?k=3"
          curl -fs http://localhost:8000/segments/1

      - name: Show API logs if anything failed
        if: failure()
        run: docker logs api || true

  retrain:
    name: Retrain and evaluate models
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-monitoring.txt

      - name: Validate data
        run: python -m shopsmart.data.validate

      - name: Data drift report (Evidently)
        run: python -m shopsmart.drift

      - name: Train customer segmentation (K-Means)
        run: python -m shopsmart.segmentation.train

      - name: Train recommenders
        run: python -m shopsmart.recommender.train

      - name: Model quality gate
        run: python scripts/check_model_quality.py

      - name: Keep MLflow runs, metrics and models
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: retrain-${{ github.run_number }}
          path: |
            mlruns/
            reports/drift/
            reports/*.json
            reports/*.csv
            models/
          retention-days: 30
